.hide{display:none!important}

/* LOGIN */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 400px at 80% -10%,rgba(95,208,167,.2),transparent 60%),linear-gradient(160deg,var(--ink),var(--forest) 150%)}
.lcard{width:100%;max-width:380px;background:#fff;border-radius:22px;padding:30px 24px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.lcard .lg{display:flex;flex-direction:column;align-items:center;margin-bottom:22px}
.lcard img{width:64px;height:64px;border-radius:50%}
.lcard h1{font-size:18px;margin-top:10px}
.lcard small{color:var(--muted);font-size:12px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:500;margin-bottom:5px}
.in{width:100%;min-height:48px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);outline:none;font-size:16px}
.in:focus{border-color:var(--mint);background:#fff;box-shadow:0 0 0 4px rgba(95,208,167,.2)}
.btn{border:none;cursor:pointer;font-weight:600;padding:13px 18px;border-radius:12px;background:linear-gradient(135deg,var(--ink),var(--forest));color:#fff;min-height:46px;transition:.15s}
.btn:hover{filter:brightness(1.15)}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--mint);filter:none}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:#b3261e;font-size:13px;margin-top:10px;min-height:18px}

/* TOPBAR */
.top{background:linear-gradient(160deg,var(--ink),var(--forest) 160%);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30}
.top img{width:36px;height:36px;border-radius:50%}
.top b{font-weight:600;letter-spacing:.02em}
.top b i{font-style:normal;color:var(--mint)}
.top small{display:block;font-size:11px;color:#b9d6cb;font-weight:300;letter-spacing:.18em;text-transform:uppercase}
.top .sp{flex:1}
.top .who{font-size:12px;color:#b9d6cb;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .btn{padding:8px 14px;min-height:38px;background:rgba(255,255,255,.1);font-size:13px}

main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(11,30,26,.05);border:1.5px solid transparent;cursor:pointer;text-align:left;transition:.15s}
.kpi:hover{border-color:var(--mint)}
.kpi.on{border-color:var(--forest)}
.kpi .t{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:30px;font-weight:700;line-height:1.15;margin-top:4px;color:var(--ink)}
.kpi .g{font-size:12px;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-weight:700}

/* tags */
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.novo{background:var(--s-novo-bg);color:var(--s-novo)}
.tag.em_analise{background:var(--s-analise-bg);color:var(--s-analise)}
.tag.aprovado{background:var(--s-ok-bg);color:var(--s-ok)}
.tag.reprovado{background:var(--s-no-bg);color:var(--s-no)}

/* distribuições */
.dist{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.panel{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(11,30,26,.05)}
.panel h3{font-size:14px;font-weight:600;margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;font-size:13px;background:none;border:none;text-align:left;cursor:pointer;padding:3px 0;border-radius:8px}
.brow:hover .fill{filter:brightness(1.15)}
.brow .trk{height:12px;background:#eef3f0;border-radius:0 6px 6px 0}
.brow .fill{height:100%;background:var(--forest);border-radius:0 4px 4px 0;min-width:2px;transition:width .4s}
.brow .n{text-align:right;font-weight:600;color:var(--ink)}
.brow .lb{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow.on .lb{color:var(--ink);font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

/* filtros */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters .in{min-height:44px;padding:9px 12px;font-size:14px;width:auto}
.filters .grow{flex:1 1 220px}
.cnt{font-size:12px;color:var(--muted);margin-left:auto}

/* tabela */
.tbl{background:var(--card);border-radius:16px;box-shadow:0 6px 20px rgba(11,30,26,.05);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;background:#fbfcfb;border-bottom:1px solid var(--line);font-weight:600}
td{padding:13px 14px;border-bottom:1px solid #eef2ef;vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:#f4faf7}
td .nm{font-weight:600}
td .sb{font-size:12px;color:var(--muted)}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(11,30,26,.5);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:41;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
.dr.on{transform:none}
.dr header{background:var(--ink);color:#fff;padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.dr header h2{font-size:17px;flex:1}
.dr header small{display:block;color:#b9d6cb;font-weight:300;font-size:12px}
.dr header button{background:rgba(255,255,255,.12);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
.dr .bd{padding:16px;overflow:auto;flex:1;padding-bottom:40px}
.sec{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.sec h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--forest);margin-bottom:10px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{word-break:break-word}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.doc{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);text-decoration:none;color:inherit;display:block}
.doc .th{aspect-ratio:1;display:grid;place-items:center;background:#eef3f0;font-size:12px;color:var(--muted)}
.doc .th img{width:100%;height:100%;object-fit:cover}
.doc .cp{font-size:12px;font-weight:600;padding:7px 8px;text-align:center}
.act{display:flex;gap:10px;flex-wrap:wrap}
.act a{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

/* MOBILE */
@media(max-width:860px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi:first-child{grid-column:1/-1}
  .dist{grid-template-columns:1fr}
  .top .who{display:none}
}
@media(max-width:700px){
  main{padding:14px 12px 50px}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr.row{padding:14px;border-bottom:1px solid #eef2ef;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
  td{padding:0;border:none}
  td.hm{display:none}
  .brow{grid-template-columns:96px 1fr 30px}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px;font-size:12px}
  .cnt{margin-left:0;width:100%}
  .filters .in,.filters .btn{flex:1 1 140px}
}
</style>
</head>

        <option value="aprovado">Aprovado</option><option value="reprovado">Reprovado</option>
      </select>
      <button class="btn ghost" id="rf">Atualizar</button>
      <button class="btn ghost" id="csv">Exportar CSV</button>
      <span class="cnt" id="cnt"></span>
    </div>

    <div class="tbl">
      <table>
        <thead><tr><th>Motorista</th><th class="hm">Telefone</th><th class="hm">Uber</th><th class="hm">KM/dia</th><th class="hm">Enviado em</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="none" style="padding:24px;text-align:center"></div>
    </div>
  </main>
</div>

<!-- DRAWER -->
<div class="ov" id="ov"></div>
<aside class="dr" id="dr" aria-hidden="true">
  <header><h2 id="dN"></h2><button id="dX" aria-label="Fechar">✕</button></header>
  <div class="bd" id="dB"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ CONFIGURAÇÃO ============ */
const CONFIG={
  SUPABASE_URL: "https://olbppjlcstlvhiwumsdg.supabase.co",       // o mesmo do formulário
  SUPABASE_ANON_KEY:""   // chave anon public
};
/* ====================================== */

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={novo:['Novo','✦'],em_analise:['Em análise','…'],aprovado:['Aprovado','✓'],reprovado:['Reprovado','✕']};
const TEMPOS=['0 a 1 ano','1 a 2 anos','2 a 4 anos','Mais de 4 anos'];
const APPS=['Uber','99','inDrive','Particular','Outro'];


/* ---------- SEM SUPABASE CONFIGURADO: painel vazio, sem dados e sem login ---------- */
const DEMO=!CONFIG.SUPABASE_URL||!CONFIG.SUPABASE_ANON_KEY;
function demoClient(){
  return{
    auth:{getSession:async()=>({data:{session:{user:{email:'Supabase não configurado'}}}}),signOut:async()=>{},signInWithPassword:async()=>({})},
    rpc:async()=>({data:true}),
    from:()=>({select:()=>({order:()=>({limit:async()=>({data:[]})})}),update:()=>({eq:async()=>({})})}),
    storage:{from:()=>({createSignedUrl:async()=>({data:null})})}
  };
}
const sb=DEMO?demoClient():window.supabase.createClient(CONFIG.SUPABASE_URL||'https://invalid.local',CONFIG.SUPABASE_ANON_KEY||'x',{auth:{persistSession:true,autoRefreshToken:true}});
let DATA=[],F={q:'',status:'',tempo:'',app:''},cur=null;

/* ---------- auth ---------- */
async function guard(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return showLogin();
  const {data,error}=await sb.rpc('is_admin');
  if(error||data!==true){await sb.auth.signOut();showLogin(error?'Não foi possível validar o acesso.':'Este usuário não tem permissão de administrador.');return}
  $('#who').textContent=session.user.email;
  $('#login').classList.add('hide');$('#app').classList.remove('hide');if(DEMO)$('#demoBar').classList.remove('hide');
  load();idle();
}
function showLogin(msg){$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#lerr').textContent=msg||''}
$('#lform').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('#lbtn');b.disabled=true;$('#lerr').textContent='';
  if(!CONFIG.SUPABASE_URL){$('#lerr').textContent='Painel sem configuração (SUPABASE_URL).';b.disabled=false;return}
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  b.disabled=false;$('#pw').value='';
  if(error){$('#lerr').textContent='E-mail ou senha incorretos.';return}
  guard();
});
$('#out').onclick=async()=>{await sb.auth.signOut();DATA=[];closeDr();showLogin()};
let idleT;function idle(){const r=()=>{clearTimeout(idleT);idleT=setTimeout(()=>$('#out').click(),30*60*1000)};['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,r,{passive:true}));r()}

/* ---------- dados ---------- */
async function load(){
  $('#none').textContent='Carregando…';
  const {data,error}=await sb.from('cadastros').select('*').order('created_at',{ascending:false}).limit(2000);
  if(error){$('#none').textContent='Erro ao carregar: '+error.message;return}
  DATA=data;render();
}
$('#rf').onclick=load;

function filtered(){
  const q=F.q.toLowerCase().replace(/\s+/g,' ').trim(),qd=q.replace(/\D/g,'');
  return DATA.filter(r=>
    (!F.status||r.status===F.status)&&(!F.tempo||r.tempo_uber===F.tempo)&&(!F.app||r.apps.includes(F.app))&&
    (!q||r.nome_completo.toLowerCase().includes(q)||(qd&&(r.cpf.replace(/\D/g,'').includes(qd)||r.telefone.replace(/\D/g,'').includes(qd))))
  );
}
const fmt=d=>new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const tag=s=>`<span class="tag ${s}"><span aria-hidden="true">${ST[s][1]}</span>${ST[s][0]}</span>`;

function render(){
  // KPIs (contagem total, independente de filtros de busca)
  const c={novo:0,em_analise:0,aprovado:0,reprovado:0};DATA.forEach(r=>c[r.status]++);
  $('#kpis').innerHTML=
    `<button class="kpi ${!F.status?'on':''}" data-s=""><div class="t">Total de cadastros</div><div class="v">${DATA.length}</div></button>`+
    Object.keys(ST).map(s=>`<button class="kpi ${F.status===s?'on':''}" data-s="${s}"><div class="t">${tag(s)}</div><div class="v">${c[s]}</div></button>`).join('');
  document.querySelectorAll('.kpi').forEach(k=>k.onclick=()=>{F.status=k.dataset.s;$('#fs').value=F.status;render()});

  // distribuições
  bars('#dTempo',TEMPOS,l=>DATA.filter(r=>r.tempo_uber===l).length,'tempo');
  bars('#dApps',APPS,l=>DATA.filter(r=>r.apps.includes(l)).length,'app');

  // lista
  const list=filtered();
  $('#cnt').textContent=list.length+' de '+DATA.length;
  $('#rows').innerHTML=list.map(r=>`<tr class="row" data-id="${esc(r.id)}">
    <td><div class="nm">${esc(r.nome_completo)}</div><div class="sb">${esc(r.cpf)}</div></td>
    <td class="hm">${esc(r.telefone)}</td><td class="hm">${esc(r.tempo_uber)}</td><td class="hm">${esc(r.km_medio_dia)} km</td>
    <td class="hm">${fmt(r.created_at)}</td><td>${tag(r.status)}</td></tr>`).join('');
  $('#none').textContent=list.length?'':(DATA.length?'Nenhum cadastro com esses filtros.':'Nenhum cadastro recebido ainda.');
  $('#none').style.display=list.length?'none':'block';
  document.querySelectorAll('tr.row').forEach(t=>t.onclick=()=>openDr(t.dataset.id));
}
function bars(sel,labels,fn,key){
  const vals=labels.map(l=>[l,fn(l)]),max=Math.max(1,...vals.map(v=>v[1]));
  $(sel).innerHTML=DATA.length?vals.map(([l,n])=>`<button class="brow ${F[key]===l?'on':''}" data-k="${key}" data-v="${esc(l)}" title="${esc(l)}: ${n} cadastro(s)">
    <span class="lb">${esc(l)}</span><span class="trk"><span class="fill" style="display:block;width:${n/max*100}%"></span></span><span class="n">${n}</span></button>`).join(''):'<div class="empty">Sem dados ainda.</div>';
  document.querySelectorAll(sel+' .brow').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;F[k]=F[k]===v?'':v;render()});
}
$('#q').oninput=e=>{F.q=e.target.value;render()};
$('#fs').onchange=e=>{F.status=e.target.value;render()};

/* ---------- CSV ---------- */
$('#csv').onclick=()=>{
  const cols=['created_at','status','nome_completo','rg','cpf','telefone','instagram','endereco_moradia','endereco_pernoite','km_medio_dia','horario_inicio','horario_fim','apps','apps_outro','tempo_uber','categoria_black','faz_particular','outra_atividade','outra_atividade_detalhe','exp_eletrico','exp_eletrico_detalhe','contato1_nome','contato1_telefone','contato1_parentesco','contato2_nome','contato2_telefone','contato2_parentesco','notas'];
  const cell=v=>{v=Array.isArray(v)?v.join(' | '):(v??'');v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const csv='﻿'+[cols.join(';'),...filtered().map(r=>cols.map(c=>cell(r[c])).join(';'))].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='cadastros-conexxa-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href);
};

/* ---------- detalhe ---------- */
const igLink=i=>/^@[A-Za-z0-9._]{1,30}$/.test(i||'')?`<a class="btn ghost" href="https://instagram.com/${esc(i.slice(1))}" target="_blank" rel="noopener">Instagram</a>`:'';
const waLink=t=>'https://wa.me/55'+String(t).replace(/\D/g,'').replace(/^55/,'');
async function openDr(id){
  cur=DATA.find(r=>r.id===id);if(!cur)return;const r=cur;
  $('#dN').innerHTML=esc(r.nome_completo)+`<small>Enviado em ${fmt(r.created_at)}</small>`;
  const kv=(a)=>'<dl class="kv">'+a.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v||'—')}</dd>`).join('')+'</dl>';
  $('#dB').innerHTML=`
    <div class="sec"><h4>Contato rápido</h4><div class="act">
      <a class="btn" href="${esc(waLink(r.telefone))}" target="_blank" rel="noopener">WhatsApp do motorista</a>
      ${igLink(r.instagram)}<a class="btn ghost" href="tel:${esc(r.telefone.replace(/\D/g,''))}">Ligar</a></div></div>
    <div class="sec"><h4>Status e anotações</h4>
      <div class="fld"><select class="in" id="eS">${Object.keys(ST).map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${ST[s][0]}</option>`).join('')}</select></div>
      <div class="fld"><textarea class="in" id="eN" rows="3" placeholder="Anotações internas…">${esc(r.notas||'')}</textarea></div>
      <button class="btn block" id="eSave">Salvar</button><div class="err" id="eMsg" style="color:#1b7a4b"></div></div>
    <div class="sec"><h4>Documentos</h4><div class="docs" id="docs"><div class="empty">Carregando…</div></div></div>
    <div class="sec"><h4>Dados pessoais</h4>${kv([['CPF',r.cpf],['RG',r.rg],['Telefone',r.telefone],['Instagram',r.instagram],['Moradia',r.endereco_moradia],['Pernoite do carro',r.endereco_pernoite]])}</div>
    <div class="sec"><h4>Rotina</h4>${kv([['KM médio/dia',r.km_medio_dia+' km'],['Horário',r.horario_inicio+' às '+r.horario_fim],['Aplicativos',r.apps.join(', ')+(r.apps_outro?' ('+r.apps_outro+')':'')],['Tempo de Uber',r.tempo_uber],['Categoria Black',r.categoria_black],['Faz particular',r.faz_particular],['Outra atividade',r.outra_atividade+(r.outra_atividade_detalhe?' — '+r.outra_atividade_detalhe:'')],['Carro elétrico',r.exp_eletrico+(r.exp_eletrico_detalhe?' — '+r.exp_eletrico_detalhe:'')]])}</div>
    <div class="sec"><h4>Contatos de referência</h4>${kv([['Contato 1',`${r.contato1_nome} · ${r.contato1_telefone}${r.contato1_parentesco?' ('+r.contato1_parentesco+')':''}`],['Contato 2',`${r.contato2_nome} · ${r.contato2_telefone}${r.contato2_parentesco?' ('+r.contato2_parentesco+')':''}`]])}</div>`;
  $('#ov').classList.add('on');$('#dr').classList.add('on');$('#dr').setAttribute('aria-hidden','false');
  $('#eSave').onclick=saveDr;
  // documentos (URLs assinadas, expiram em 5 min)
  const items=[['CNH',r.cnh_path],['Selfie c/ documento',r.selfie_path],['Comprovante',r.comprovante_path]];
  const out=await Promise.all(items.map(async([n,p])=>{
    const {data}=await sb.storage.from('documentos').createSignedUrl(p,300);
    const pdf=p.endsWith('.pdf');
    return data?`<a class="doc" href="${esc(data.signedUrl)}" target="_blank" rel="noopener"><div class="th">${pdf?'PDF':`<img src="${esc(data.signedUrl)}" alt="${esc(n)}" loading="lazy">`}</div><div class="cp">${esc(n)}</div></a>`
               :`<div class="doc"><div class="th">indisponível</div><div class="cp">${esc(n)}</div></div>`;
  }));
  if(cur===r&&$('#docs'))$('#docs').innerHTML=out.join('');
}
async function saveDr(){
  const b=$('#eSave');b.disabled=true;
  const patch={status:$('#eS').value,notas:$('#eN').value.trim()||null};
  const {error}=await sb.from('cadastros').update(patch).eq('id',cur.id);
  b.disabled=false;
  if(error){$('#eMsg').style.color='#b3261e';$('#eMsg').textContent='Erro ao salvar: '+error.message;return}
  Object.assign(cur,patch);$('#eMsg').style.color='#1b7a4b';$('#eMsg').textContent='✓ Salvo';render();
}
function closeDr(){cur=null;$('#ov').classList.remove('on');$('#dr').classList.remove('on');$('#dr').setAttribute('aria-hidden','true')}
$('#ov').onclick=closeDr;$('#dX').onclick=closeDr;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr()});

guard();
</script>
</body>
</html>
